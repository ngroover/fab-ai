[package]
name = "environment"
version = "0.1.0"
edition = "2024"

[features]
# Game logs (`Gamestate::log` / `Player::log`). On by default; build with
# `--no-default-features` to compile them out, so the game state carries no
# log fields (for measuring raw simulation speed).
default = ["logging"]
logging = []

[dependencies]
bitflags = "2.8"
rand = "0.10.1"
